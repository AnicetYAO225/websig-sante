{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="{% static 'img/e-sante.png' %}" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/login.css' %}">
        <title>Mot de passe oublié</title>
    </head>
    <body>
        <div class="auth-container">
            <div class="logo">
                <img src="{% static 'img/e-sante.png' %}" alt="e-santé">
            </div>
            <form method="post" class="auth-form">
                {% csrf_token %}
                <h2>Mot de passe oublié</h2>
                <p class="text-muted small">Saisissez votre e-mail pour recevoir le lien de réinitialisation.</p>
                {{ form.email.errors }}
                <div class="form-group">
                    <label for="id_email">E-mail</label>
                    {{ form.email }}
                </div>
                <button class="btn mt-2" type="submit">Envoyer le lien</button>
                <div class="auth-link">
                    <a href="{% url 'frontend:auth' %}">Retour à la connexion</a>
                </div>
            </form>
        </div>
    </body>
</html>
