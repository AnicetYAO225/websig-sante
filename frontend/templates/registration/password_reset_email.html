<!DOCTYPE html>
<html lang="fr">
  {% load static %}
  <head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="{% static 'img/e-sante.png' %}" type="image/x-icon">
  </head>
<body style="margin:0;padding:24px;background:#f4f8fb;font-family:Arial,sans-serif;color:#17324d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dbe8ef;border-radius:14px;overflow:hidden;">
      <tr><td style="padding:26px 30px;background:#2596be;color:#ffffff;"><h1 style="margin:0;font-size:22px;">e-santé</h1></td></tr>
      <tr><td style="padding:30px;">
        <h2 style="margin:0 0 14px;font-size:20px;">Réinitialisation du mot de passe</h2>
        <p style="line-height:1.6;">Bonjour {{ user.get_full_name }},</p>
        <p style="line-height:1.6;">Vous avez demandé la réinitialisation de votre mot de passe e-santé.</p>
        <p style="margin:28px 0;text-align:center;"><a href="{{ protocol }}://{{ domain }}{% url 'frontend:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:13px 22px;background:#2596be;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold;">Réinitialiser mon mot de passe</a></p>
        <p style="font-size:13px;color:#64748b;line-height:1.5;">Si vous n’avez pas demandé cette réinitialisation, ignorez simplement cet e-mail.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
